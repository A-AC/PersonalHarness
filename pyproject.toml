[project]
name = "personal-harness"
version = "1.0.0"
description = "Personal assistant harness v1"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "mcp==1.13.1",
    "pydantic==2.11.7",
    "pyyaml==6.0.2",
    "starlette==0.46.2",
    "uvicorn==0.34.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
]

[project.scripts]
harness = "harness.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "live: tests that call a real inference endpoint",
]
