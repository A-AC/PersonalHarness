# A. Project and domain continuity.
#
# Every scenario is deterministic. Live mode may enable a scenario by adding
# "live" to its modes list; the same state assertions then check the real model.
scenarios:
  - id: A01_hypothetical_project_not_created
    name: A hypothetical project is discussed but not created
    category: A_project_continuity
    severity: high
    description: >-
      A speculative project must remain conversation, not permanent structure.
      The test checks the persisted domain registry, not the wording alone.
    modes: [deterministic, live]
    steps:
      - kind: turn
        input: I'm thinking about maybe starting a balcony herb garden someday.
        script:
          - tasks:
              - goal: Discuss the balcony herb garden idea
                domain_name: null
                depends_on: []
          - kind: respond
            message: A balcony herb garden sounds like a possible future project. I won't create a project or domain unless you ask.
        expect:
          metric: project_association
          response:
            contains: [balcony herb garden]
            excludes: [created the domain]
          domains:
            not_created: [Balcony Herb Garden]
          tasks:
            any:
              - goal_contains: balcony herb garden
                state: completed
          misc:
            no_error: true

  - id: A02_continue_known_project_without_switch
    name: Known project is continued without a manual switch
    category: A_project_continuity
    severity: high
    description: >-
      The user's explicit working domain stays Homelab. Evidence in memory
      associates new garden work with Garden anyway, without changing the
      session selection or moving existing work.
    modes: [deterministic, live]
    fixtures:
      domains:
        - name: Garden
          reason: evaluation fixture
        - name: Homelab
          reason: evaluation fixture
      active_domain: Homelab
      memories:
        - key: garden_valve
          content: The garden irrigation valve closes at dusk.
          scope: domain:Garden
        - key: homelab_switch
          content: The rack switch is at 10.0.0.2.
          scope: domain:Homelab
      tasks:
        - key: existing_garden
          goal: Existing garden task
          domain: Garden
          state: ready
    steps:
      - kind: turn
        input: Check the garden irrigation schedule.
        script:
          - tasks:
              - goal: Check the garden irrigation schedule
                depends_on: []
          - kind: respond
            message: I'll check the garden irrigation schedule.
        expect:
          metric: project_association
          tasks:
            any:
              - goal_contains: garden irrigation schedule
                domain: Garden
          domains:
            active: Homelab
          misc:
            no_error: true

  - id: A03_two_projects_one_request
    name: One request spans two existing projects
    category: A_project_continuity
    severity: high
    description: Each task is associated with the correct existing project.
    modes: [deterministic, live]
    fixtures:
      domains:
        - name: Garden
          reason: evaluation fixture
        - name: Homelab
          reason: evaluation fixture
    steps:
      - kind: turn
        input: Check the garden irrigation and the homelab rack switch.
        script:
          - tasks:
              - goal: Check the garden irrigation
                domain_name: Garden
                depends_on: []
              - goal: Check the homelab rack switch
                domain_name: Homelab
                depends_on: []
          - kind: respond
            message: I'll check both the garden irrigation and the homelab rack switch.
        expect:
          metric: project_association
          tasks:
            count: 2
            new: true
            domain_for:
              goal_contains: garden irrigation
              domain: Garden
          assertions:
            - id: A03.homelab_task_domain
              type: task_domain
              goal_contains: homelab rack switch
              domain: Homelab
              metric: project_association
          misc:
            no_error: true

  - id: A04_unrelated_exchange_keeps_structure
    name: A brief unrelated exchange creates no permanent domain
    category: A_project_continuity
    severity: medium
    description: >-
      A short weather question is not evidence for persistent project
      structure. The full domain set must remain unchanged.
    modes: [deterministic, live]
    fixtures:
      domains:
        - name: Garden
          reason: evaluation fixture
    steps:
      - kind: turn
        input: What is the weather like today?
        script:
          - tasks:
              - goal: Answer the weather question
                depends_on: []
          - kind: respond
            message: I don't have weather access, so I can't check today's weather.
        expect:
          metric: project_association
          response:
            shows_limitation: true
          domains:
            unchanged: true
          tasks:
            count: 1
            new: true
          misc:
            no_error: true

  - id: A05_ambiguous_project_recorded
    name: Ambiguous project association is recorded as ambiguous
    category: A_project_continuity
    severity: high
    description: >-
      Identical evidence in two projects makes the association ambiguous. It
      must be recorded in an event, not silently presented as certain.
    modes: [deterministic, live]
    fixtures:
      domains:
        - name: Garden
          reason: evaluation fixture
        - name: Homelab
          reason: evaluation fixture
      memories:
        - key: garden_key
          content: The spare key is in the blue drawer.
          scope: domain:Garden
        - key: homelab_key
          content: The spare key is in the blue drawer.
          scope: domain:Homelab
    steps:
      - kind: turn
        input: Where is the spare key?
        script:
          - tasks:
              - goal: Find the spare key
                depends_on: []
          - kind: respond
            message: I can't tell whether you mean the Garden or Homelab project; both have the same note.
        expect:
          metric: project_association
          response:
            contains_any: [ambig, both, can't tell]
          events:
            - operation: plan.domain_inference
              result: ambiguous
          domains:
            none_active: true
          misc:
            no_error: true

  - id: A06_correct_project_without_moving_work
    name: New work is associated correctly without moving existing records
    category: A_project_continuity
    severity: high
    description: >-
      Homelab work is associated with Homelab. The existing Garden task and
      both scoped memories must remain untouched.
    modes: [deterministic, live]
    fixtures:
      domains:
        - name: Garden
          reason: evaluation fixture
        - name: Homelab
          reason: evaluation fixture
      active_domain: Garden
      memories:
        - key: garden_valve
          content: The garden valve closes at dusk.
          scope: domain:Garden
        - key: homelab_switch
          content: The homelab rack switch is at 10.0.0.2.
          scope: domain:Homelab
      tasks:
        - key: existing_garden
          goal: Existing garden task
          domain: Garden
          state: blocked
          block_reason: awaiting_user_input
    steps:
      - kind: turn
        input: Check the homelab rack switch.
        script:
          - tasks:
              - goal: Check the homelab rack switch
                domain_name: Homelab
                depends_on: []
          - kind: respond
            message: I'll check the homelab rack switch.
        expect:
          metric: project_association
          tasks:
            any:
              - goal_contains: homelab rack switch
                domain: Homelab
              - goal_contains: Existing garden task
                domain: Garden
                state: blocked
          memory:
            unchanged: true
          domains:
            active: Garden
          misc:
            no_error: true

  - id: A07_known_fact_vs_suggestion
    name: Known project fact is distinguished from a new suggestion
    category: A_project_continuity
    severity: high
    description: >-
      The response may recommend plants, but it must label them as suggestions
      and must not claim the user already decided.
    modes: [deterministic, live]
    fixtures:
      domains:
        - name: Garden
          reason: evaluation fixture
      active_domain: Garden
      memories:
        - key: no_plants
          content: The garden project has no plant selection yet.
          scope: domain:Garden
    steps:
      - kind: turn
        input: What plants should the garden have?
        script:
          - tasks:
              - goal: Recommend garden plants
                domain_name: Garden
                depends_on: []
          - kind: respond
            message: No plant selection has been made. I suggest rosemary and lavender as options.
        expect:
          metric: grounding
          response:
            contains: [no plant selection]
            labels_suggestion: true
            excludes: [you chose plants, we decided on rosemary]
            no_success_claim: true
          context:
            retrieved_memory_contains: [no plant selection]
          misc:
            no_error: true
