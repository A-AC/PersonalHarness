# K. Routing corpus (Phase 10A baseline).
#
# Five placeholder domains stand in for the real ones users will create. The
# anchor keeps every scenario on the same fixture; the loader ignores the
# top-level ``x-domains`` key because the file has a ``scenarios:`` list.
#
# Expected domains are labels, not a promise about the current router: at the
# Phase 10A baseline most messages without the literal domain name route to
# General. 10B measures the improvement against this file.
x-domains: &domains
  - name: Health
    description: "health, fitness, nutrition, calories, protein, diet, sleep, exercise, doctor, symptoms"
    keywords: [nutrition, calories, protein, diet, exercise, sleep, fitness, healthy]
    examples:
      - "how many calories are in this"
      - "is this healthy"
      - "how much protein is in this"
  - name: Home automation
    description: "smart home, lights, thermostat, heating, scenes, sensors, automation"
    keywords: [lights, thermostat, heating, scene, sensor, automation, porch, kitchen]
    examples:
      - "turn off the lights"
      - "set the thermostat"
  - name: Language learning
    description: "language study, Spanish, French, vocabulary, grammar, flashcards, practice"
    keywords: [spanish, french, german, italian, vocabulary, grammar, flashcards, pronunciation]
    examples:
      - "how do I say this in Spanish"
      - "quiz me on French verbs"
  - name: Clothing
    description: "clothing, wardrobe, outfits, wear, weather, dress, shoes, jacket"
    keywords: [outfit, wear, shirt, shoes, jacket, wardrobe, dress, coat]
    examples:
      - "what should I wear"
      - "does this match my outfit"

# Learned-evidence fixtures use domains whose explicit routing vocabulary does
# not overlap the learned queries. This keeps the new cases focused on the
# production memory, task, skill, and recent-message paths.
x-fermentation-domain: &fermentation-domain
  - name: Fermentation
    description: "food preservation and microbial cultures"

x-astronomy-domain: &astronomy-domain
  - name: Astronomy
    description: "observing equipment and the night sky"

x-memory-only-fixtures: &memory-only-fixtures
  domains: *fermentation-domain
  memories:
    - content: "sourdough starter feeding schedule"
      domain: Fermentation
    - content: "bread hydration ratios"
      domain: Fermentation

x-past-task-only-fixtures: &past-task-only-fixtures
  domains: *astronomy-domain
  tasks:
    - objective: "telescope collimation and eyepiece cleaning"
      domain: Astronomy

x-single-term-fixtures: &single-term-fixtures
  domains: *fermentation-domain
  memories:
    - content: "sourdough baking notes"
      domain: Fermentation

x-recent-message-fixtures: &recent-message-fixtures
  domains:
    - name: Astronomy
      description: "observing equipment and the night sky"
  messages:
    - role: user
      content: "telescope collimation tips"
      domain: Astronomy

