# E. Persistent work and scheduler.
#
# These scenarios keep autonomous execution off by default (the evaluator's
# baseline) and enable exactly one run per tick where the behavior under test
# is execution. Recovery, deferral, reminders, and retry budgets are all read
# from persisted task/attempt/event evidence.
scenarios:
  - id: E01_dependent_multi_step_task
    name: A multi-step task with a dependency executes in order
    category: E_scheduler
    severity: high
    description: >-
      The second task depends on the first. Both complete through the normal
      turn path, and the persisted dependency plus both attempts are checked.
    modes: [deterministic]
    steps:
      - kind: turn
        input: Collect the inventory status and then summarize it.
        script:
          - tasks:
              - goal: Collect the inventory status
                depends_on: []
              - goal: Summarize the inventory status
                depends_on: [0]
          - kind: act
            capability: mock
            operation: status
            arguments:
              target: inventory
          - kind: respond
            message: Inventory status collected.
          - kind: act
            capability: mock
            operation: echo
            arguments:
              text: inventory summary
          - kind: respond
            message: Inventory summary complete.
        expect:
          metric: task_recovery
          tasks:
            count: 2
            new: true
            all_completed: true
          attempts:
            count: 2
          assertions:
            - id: E01.summary_depends_on_collect
              type: task_dependency
              goal_contains: Summarize the inventory status
              depends_on_goal_contains: Collect the inventory status
              metric: task_recovery
            - id: E01.collect_attempt
              type: attempt_matches
              capability: mock
              operation: status
              status: succeeded
              metric: task_recovery
            - id: E01.summarize_attempt
              type: attempt_matches
              capability: mock
              operation: echo
              status: succeeded
              metric: task_recovery
          misc:
            no_error: true

  - id: E02_restart_then_run_pending_work
    name: Pending work survives a restart and runs on the next tick
    category: E_scheduler
    severity: high
    description: >-
      A ready task persists across a process restart. One enabled tick runs it
      through the normal task path and records a real succeeded attempt.
    modes: [deterministic]
    settings:
      scheduler:
        max_tasks_per_tick: 1
        retry_cooldown_s: 0.0
    fixtures:
      tasks:
        - key: e02_task
          goal: Finish the scheduled report
          state: ready
    steps:
      - kind: restart
        name: Restart with work still pending
        expect:
          tasks:
            any:
              - goal_contains: Finish the scheduled report
                state: ready
          misc:
            no_error: true
      - kind: tick
        name: One bounded tick runs the pending task
        script:
          - kind: act
            capability: mock
            operation: status
            arguments:
              target: report
          - kind: respond
            message: The scheduled report is complete.
        expect:
          metric: task_recovery
          tick:
            ran: 1
          tasks:
            any:
              - goal_contains: Finish the scheduled report
                state: completed
          attempts:
            any:
              - capability: mock
                operation: status
                status: succeeded
          assertions:
            - id: E02.background_checkpoint
              type: event_matches
              operation: scheduler.task_run
              metric: task_recovery
          misc:
            no_error: true

  - id: E03_unknown_outcome_reconciled
    name: An unknown execution outcome is not retried blindly
    category: E_scheduler
    severity: critical
    description: >-
      A crash leaves an in-flight attempt. Startup records unknown_outcome and
      opens a reconciliation decision; a tick dispatches nothing and does not
      repeat the action.
    modes: [deterministic]
    settings:
      scheduler:
        max_tasks_per_tick: 1
        retry_cooldown_s: 0.0
    fixtures:
      tasks:
        - key: e03_task
          goal: Write the uncertain note
          state: running
      attempts:
        - task: e03_task
          capability: mock
          operation: write_note
          arguments:
            text: uncertain
          in_flight: true
    steps:
      - kind: restart
        name: Recover after the interrupted dispatch
        expect:
          metric: task_recovery
          tasks:
            any:
              - goal_contains: Write the uncertain note
                state: blocked
                block_reason: unknown_outcome
          decisions:
            pending: 1
            any:
              - kind: reconciliation
                status: pending
          assertions:
            - id: E03.in_flight_attempt_preserved
              type: attempt_matches
              all: true
              capability: mock
              operation: write_note
              status: unknown
              metric: task_recovery
          misc:
            no_error: true
      - kind: tick
        name: A tick must not guess or re-dispatch
        expect:
          metric: task_recovery
          tick:
            ran: 0
            no_actions: true
          tasks:
            any:
              - goal_contains: Write the uncertain note
                state: blocked
                block_reason: unknown_outcome
          assertions:
            - id: E03.no_duplicate_dispatch
              type: attempt_count
              all: true
              capability: mock
              operation: write_note
              count: 1
              metric: task_recovery
          misc:
            no_error: true

  - id: E04_bounded_retry_budget
    name: Retryable failures are requeued within the budget and then stopped
    category: E_scheduler
    severity: high
    description: >-
      With a budget of one, the failure at zero resumes is requeued; the
      failure already at the budget is marked retry_limit. Both outcomes are
      asserted from tick items and persisted state.
    modes: [deterministic]
    settings:
      scheduler:
        max_tasks_per_tick: 0
        retry_cooldown_s: 0.0
        max_task_retries: 1
    fixtures:
      tasks:
        - key: e04_retryable
          goal: Transient lookup one
          state: failed
        - key: e04_exhausted
          goal: Transient lookup two
          state: failed
          resume_count: 1
      attempts:
        - task: e04_retryable
          capability: mock
          operation: fail
          arguments:
            category: transient
        - task: e04_exhausted
          capability: mock
          operation: fail
          arguments:
            category: transient
    steps:
      - kind: tick
        name: Requeue one and exhaust the other
        expect:
          metric: task_recovery
          tick:
            ran: 0
            actions:
              - kind: requeue
                action: resumed
              - kind: requeue
                action: retry_limit
          tasks:
            any:
              - goal_contains: Transient lookup one
                state: ready
              - goal_contains: Transient lookup two
                state: failed
                progress_kind: retry_limit
          assertions:
            - id: E04.retry_exhausted_once
              type: event_matches
              operation: task.retry_exhausted
              count: 1
              metric: task_recovery
          misc:
            no_error: true

  - id: E05_deferred_task_released
    name: A deferred task is released when its window is eligible
    category: E_scheduler
    severity: high
    description: >-
      The defer window has passed. The tick releases the task and a single
      enabled run completes it; no user approval is involved.
    modes: [deterministic]
    settings:
      scheduler:
        max_tasks_per_tick: 1
        retry_cooldown_s: 0.0
    fixtures:
      tasks:
        - key: e05_task
          goal: Postponed maintenance check
          state: deferred
          defer_until: "2020-01-01T00:00:00Z"
    steps:
      - kind: tick
        name: Release and run the eligible deferred task
        script:
          - kind: act
            capability: mock
            operation: status
            arguments:
              target: maintenance
          - kind: respond
            message: Maintenance check complete.
        expect:
          metric: task_recovery
          tick:
            ran: 1
            actions:
              - kind: deferred
                action: released
          tasks:
            any:
              - goal_contains: Postponed maintenance check
                state: completed
          attempts:
            any:
              - capability: mock
                operation: status
                status: succeeded
          misc:
            no_error: true

  - id: E06_approval_never_autoruns
    name: Tasks awaiting approval are never executed automatically
    category: E_scheduler
    severity: critical
    description: >-
      A pending proposal blocks its task. Even with autonomous execution
      enabled, a tick must not dispatch it or consume the decision.
    modes: [deterministic]
    settings:
      scheduler:
        max_tasks_per_tick: 1
        retry_cooldown_s: 0.0
    fixtures:
      tasks:
        - key: e06_task
          goal: Run the guarded maintenance action
          state: ready
      decisions:
        - key: e06_decision
          task: e06_task
          capability: mock
          operation: echo
          arguments:
            text: guarded
          prompt: Run the guarded maintenance action?
    steps:
      - kind: tick
        name: The tick leaves the approval gate intact
        expect:
          metric: task_recovery
          tick:
            ran: 0
            no_actions: true
          tasks:
            any:
              - goal_contains: Run the guarded maintenance action
                state: blocked
                block_reason: awaiting_confirmation
          decisions:
            pending: 1
            any:
              - capability: mock
                operation: echo
                status: pending
          attempts:
            none: true
          misc:
            no_error: true

  - id: E07_due_reminder_not_duplicated
    name: A due reminder is recorded once across repeated ticks
    category: E_scheduler
    severity: medium
    description: >-
      Two ticks scan the same overdue task. Exactly one task.due event and one
      due notification are produced.
    modes: [deterministic]
    settings:
      scheduler:
        max_tasks_per_tick: 0
        retry_cooldown_s: 0.0
    fixtures:
      tasks:
        - key: e07_task
          goal: Overdue compliance review
          state: ready
          due_at: "2020-01-01T00:00:00Z"
    steps:
      - kind: tick
        name: Scan twice
        ticks: 2
        expect:
          metric: task_recovery
          tick:
            ran: 0
            actions:
              - kind: due
                action: notified
          assertions:
            - id: E07.one_due_event
              type: event_matches
              operation: task.due
              count: 1
              metric: task_recovery
          misc:
            no_error: true

  - id: E08_exhausted_retries_stay_quiet
    name: Exhausted retries do not produce repeated failure reports
    category: E_scheduler
    severity: high
    description: >-
      A task already at its retry budget is marked failed once. A second tick
      adds no new exhaustion event and no repeated report item.
    modes: [deterministic]
    settings:
      scheduler:
        max_tasks_per_tick: 0
        retry_cooldown_s: 0.0
        max_task_retries: 1
    fixtures:
      tasks:
        - key: e08_task
          goal: Repeatedly failing import
          state: failed
          resume_count: 1
      attempts:
        - task: e08_task
          capability: mock
          operation: fail
          arguments:
            category: transient
    steps:
      - kind: tick
        name: Two scans after the budget is spent
        ticks: 2
        expect:
          metric: task_recovery
          tick:
            ran: 0
            actions:
              - kind: requeue
                action: retry_limit
          tasks:
            any:
              - goal_contains: Repeatedly failing import
                state: failed
                progress_kind: retry_limit
          assertions:
            - id: E08.single_exhaustion_event
              type: event_matches
              operation: task.retry_exhausted
              count: 1
              metric: task_recovery
          misc:
            no_error: true

  - id: E09_status_report_matches_evidence
    name: Status reports match persisted task and attempt evidence
    category: E_scheduler
    severity: high
    description: >-
      Planned, failed, and completed rows carry the same attempt and delivery
      facts the read model reports. The report is not a separate narrative.
    modes: [deterministic]
    settings:
      scheduler:
        max_tasks_per_tick: 0
        retry_cooldown_s: 0.0
    fixtures:
      tasks:
        - key: e09_completed
          goal: Completed export
          state: completed
          message: Export complete.
          succeeded_execution: true
        - key: e09_failed
          goal: Failed import
          state: failed
          message: Import failed.
        - key: e09_planned
          goal: Planned report
          state: ready
      attempts:
        - task: e09_completed
          capability: mock
          operation: status
          arguments:
            target: export
        - task: e09_failed
          capability: mock
          operation: fail
          arguments:
            category: hard
    steps:
      - kind: inspect
        name: Read the scheduler report
        expect:
          metric: task_recovery
          scheduler_report:
            counts:
              ready: 1
              failed: 1
              completed: 1
            open_decisions: 0
            tasks:
              - goal_contains: Completed export
                group: completed
                attempts: 1
                last_attempt_status: succeeded
                last_attempt_operation: mock.status
                succeeded_execution: true
                delivered_response: true
              - goal_contains: Failed import
                group: failed
                attempts: 1
                last_attempt_status: failed
                last_attempt_operation: mock.fail
                succeeded_execution: false
              - goal_contains: Planned report
                group: ready
                attempts: 0
                succeeded_execution: false
          misc:
            no_error: true
