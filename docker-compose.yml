services:
  harness:
    build: .
    image: personal-harness:2.0.0
    ports:
      - "${HARNESS_PORT:-8080}:8080"
    environment:
      HARNESS_DATA_DIR: /data
      HARNESS_HOST: 0.0.0.0
      HARNESS_PORT: "8080"
      HARNESS_TOKEN: "${HARNESS_TOKEN:-change-this-token}"
      HARNESS_MODEL_BASE_URL: "${HARNESS_MODEL_BASE_URL:-http://192.168.50.40:8181}"
      HARNESS_MODEL_NAME: "${HARNESS_MODEL_NAME:-qwen3.5-9b}"
    volumes:
      - harness-data:/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  harness-data:
