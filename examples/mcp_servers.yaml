# Optional stdio MCP servers.
#
# Point tools.mcp_servers_file in data/config.yaml at a copy of this file
# (absolute path recommended). Tools are discovered at harness start; a
# server that fails to start is shown as unavailable and never blocks turns.
#
# autoapprove: true  -> the server's tools run without per-call approval
# (default)          -> every call needs an explicit approval
servers:
  - name: example_echo
    command: python
    args:
      - examples/mcp/echo_server.py
    autoapprove: true
