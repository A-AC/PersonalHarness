# Optional stdio MCP servers.
#
# Two equivalent formats are accepted (YAML or JSON):
#
#   servers:      # this list shape (harness-specific extras allowed)
#     - name: ...
#   mcpServers:   # the standard mapping shape used by MCP clients
#     name: {command: ..., args: [...]}
#
# Point tools.mcp_servers_file in data/config.yaml at a copy of this file
# (absolute path recommended). If that key is empty, the harness automatically
# uses <data_dir>/mcp.json, <data_dir>/mcp_servers.yaml, or
# <data_dir>/mcp_servers.yml when one exists.
#
# Entries are imported into module rows (id: mcp:<name>) on first load. An
# explicit reload (`python -m harness modules --reload`) re-reads the file and
# updates existing rows, so editing an entry is a one-command operation.
#
# `${data_dir}` in command/args expands to the absolute data directory. Use it
# for server config files so the same entry works locally and in Docker.
#
# Fields:
#   transport     stdio only for now (`type` is accepted as an alias)
#   command       executable to launch (required)
#   args          argument list
#   env           environment variables. Variable names are stored in the
#                 module row; values are written to a private sidecar at
#                 data/modules/mcp/<name>.env.json, never to SQLite.
#   domains       bind the module to these domains (scope=domain).
#                 Omit/empty for scope=global
#   scope         explicit global|domain (inferred from domains when omitted)
#   autoapprove   true -> calls run without per-call approval (default false)
#   risk_default  low|confirm (default: modules.default_mcp_risk)
#   tools_allow   only expose these discovered tool names
#   tools_deny    never expose these discovered tool names
#   tool_prefix   prefix for registered tool names. Omit for the default
#                 mcp_<server>_<tool>; set "" to keep the server's own names.
#   read_only     true -> output cannot change the world; stays low-risk in a
#                 tainted run. Default false: unknown provenance is
#                 side-effecting.
#   trust_annotations
#                 true -> honour the server's MCP annotations.readOnlyHint
#                 claims for individual tools. These are claims, so they are
#                 honoured only when this server is trusted.
#   tool_risk     mapping of tool name -> low|confirm. Overrides risk for
#                 that tool only; other risk and trust flags are unchanged.
#   side_effects  explicit override; defaults to not read_only
#   startup       eager|lazy (default lazy: use cached discovery, launch on
#                 first call or reload)
#   timeout_s     per-request subprocess timeout (default 30)
#
# MCP annotations are claims, not facts. They are honoured only for servers
# with trust_annotations: true. Annotated reads remain untrusted output: after
# a read enters a run, a side-effecting non-read-only tool needs approval even
# when it is auto-approved or configured low-risk.

servers:
  - name: example_echo
    command: python
    args:
      - examples/mcp/echo_server.py
    autoapprove: true
    read_only: true
    startup: lazy
    timeout_s: 30
    tools_allow:
      - echo
      - add

  # Web search (SearXNG). The server owns its own config file; the harness
  # only knows the command line. Copy harness/modules/web/web.example.json to
  # ${data_dir}/modules/mcp/web.json and adjust it. tool_prefix: "" keeps
  # web_search stable.
  # - name: web
  #   command: python
  #   args:
  #     - harness/modules/web/server.py
  #     - --config
  #     - ${data_dir}/modules/mcp/web.json
  #   tool_prefix: ""
  #   tools_allow: [web_search]
  #   risk_default: low
  #   autoapprove: true
  #   read_only: true
  #   trust_annotations: true
  #   side_effects: false
  #   startup: lazy
  #   timeout_s: 60

  # Calendar (CalDAV/Baikal). See harness/modules/calendar/README.md. Writes
  # are confirm-risk; set read_only: true in the calendar config and here for
  # a read-only surface.
  # - name: calendar
  #   command: python
  #   args:
  #     - harness/modules/calendar/server.py
  #     - --config
  #     - ${data_dir}/modules/mcp/calendar.json
  #   tool_prefix: ""
  #   risk_default: confirm
  #   trust_annotations: true
  #   side_effects: true
  #   startup: lazy
  #   timeout_s: 60

  # Domain-bound example: only eligible for tasks in dom_example. Enable the
  # binding with `python -m harness modules --enable mcp:example_domain`.
  # - name: example_domain
  #   command: python
  #   args:
  #     - examples/mcp/echo_server.py
  #   domains:
  #     - dom_example
  #   tools_allow:
  #     - echo
  #   autoapprove: false
  #   read_only: false
  #   side_effects: true
  #   startup: eager
