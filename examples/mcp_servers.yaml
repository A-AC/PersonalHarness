# Optional stdio MCP servers.
#
# Set capabilities.mcp_servers_file to an absolute path containing this file
# (or point it at your own copy). Manifests are loaded at harness start; a
# server that fails to start is shown as unavailable and never blocks turns.
#
# Permission values: read, write, destructive. The harness still applies its
# global policy and the per-domain enablement list before a call is dispatched.
servers:
  - name: example_echo
    command: python
    args:
      - examples/mcp/echo_server.py
    default_permission: read
    permissions:
      echo: read
